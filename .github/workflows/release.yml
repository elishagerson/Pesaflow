name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.2; leave empty to infer from pubspec.yaml or git tag)"
        required: false
        default: ""
      draft:
        description: "Publish as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Publish as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze lib test

      - name: Run tests
        run: flutter test

      - name: Set release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" =~ ^v[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG_NAME=v${VERSION}" >> "$GITHUB_ENV"
          echo "Release version: v${VERSION}"

      - name: Configure Keystore / Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing secrets detected. Writing keystore and key.properties..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "::warning::Release signing secrets not found. Falling back to debug keystore signing."
          fi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Organize and rename APK artifacts
        run: |
          mkdir -p release_assets
          # Universal APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_assets/pesaflow-${VERSION}-universal.apk
          fi
          # Split ABI APKs
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/pesaflow-${VERSION}-arm64-v8a.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/pesaflow-${VERSION}-armeabi-v7a.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/pesaflow-${VERSION}-x86_64.apk
          fi

          # Generate SHA-256 Checksums
          cd release_assets
          sha256sum pesaflow-*.apk > pesaflow-${VERSION}-checksums-sha256.txt
          echo "Generated APKs and Checksums:"
          cat pesaflow-${VERSION}-checksums-sha256.txt

      - name: Extract or generate release notes
        run: |
          if scripts/changelog-section.sh "$VERSION" > release_notes.md 2>/dev/null; then
            echo "Extracted release notes for v$VERSION from CHANGELOG.md"
          else
            echo "## Pesaflow v${VERSION}" > release_notes.md
            echo "" >> release_notes.md
            echo "Release build for Pesaflow v${VERSION}." >> release_notes.md
          fi

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pesaflow-v${{ env.VERSION }}-apks
          path: release_assets/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body_path: release_notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: release_assets/*
          fail_on_unmatched_files: true
