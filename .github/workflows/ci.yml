name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: dart analyze lib test

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Verify generated files are up to date
        run: |
          dart run build_runner build
          git diff --exit-code || (echo "::error::Generated files (*.g.dart) are out of date. Run 'dart run build_runner build' locally and commit the changes." && exit 1)

      - name: Test
        run: flutter test
